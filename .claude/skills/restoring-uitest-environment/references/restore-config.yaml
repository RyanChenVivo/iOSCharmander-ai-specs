# UITest Environment Restore Configuration
# Start small: Only verified restore actions and test cases

# Simulator preferences for environment preparation
simulator_preferences:
  ios_version: "26.0"  # Preferred iOS version
  device_pattern: "iPhone 17"  # Device name pattern (supports regex)
  fallback_device: "iPhone 16 Pro"  # Fallback if preferred not found

# Execution settings
execution:
  scheme: Restore  # Dedicated scheme with RESTORE_ENABLED=true hardcoded
  # No environment variable prefixes needed — scheme handles it

# Available restore actions
# test_method_pattern uses {credential} placeholder
restore_actions:
  deleteOrganization:
    description: Delete all organizations from test account
    test_method_pattern: "RestoreUITest/test_restore_deleteOrganization_{credential}"
    execution_type: uitest
    uat_helper: UATHelper.deleteTestOrganization
    available_credentials: [newToVORTEX, testAIControlSetting]

# Test-specific overrides
test_overrides:
  # NewToVortex test series - all use newToVORTEX credential
  "NewToVortexUITest.test_newToVortex":
    actions: [deleteOrganization]
    credential: newToVORTEX

  "NewToVortexUITest.test_newToVortex_tryDifferentEmail":
    actions: [deleteOrganization]
    credential: newToVORTEX

  "NewToVortexUITest.test_createOrganizationWithRestrictFormat":
    actions: [deleteOrganization]
    credential: newToVORTEX

  # AIControlSetting test series - all use testAIControlSetting credential
  "AIControlSettingUITest.testAgreementDisable":
    actions: [deleteOrganization]
    credential: testAIControlSetting

  "AIControlSettingUITest.testAIFacialOptionOnOffFunction":
    actions: [deleteOrganization]
    credential: testAIControlSetting

  "AIControlSettingUITest.testAILicensePlateOptionOnOffFunction":
    actions: [deleteOrganization]
    credential: testAIControlSetting

  "AIControlSettingUITest.testControlSettingCheckAgreementNotShowAgain":
    actions: [deleteOrganization]
    credential: testAIControlSetting

  "AIControlSettingUITest.testForceContinue":
    actions: [deleteOrganization]
    credential: testAIControlSetting

# File defaults (for tests not in test_overrides)
file_defaults: {}

# Notes:
# - Add more restore_actions as needed through interactive flow
# - Add more test_overrides as we encounter failures requiring restore
# - Keep this file minimal and grow it organically
